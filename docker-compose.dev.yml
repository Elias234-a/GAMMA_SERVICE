version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6-alpine
    container_name: gamma-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: gamma_service_dev
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - gamma-dev-network

  # Backend API (Development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: gamma-backend-dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: development
      PORT: 8001
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/gamma_service_dev?authSource=admin
      JWT_SECRET: dev_jwt_secret_not_for_production
      JWT_EXPIRES_IN: 30d
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - gamma-dev-network
    command: npm run dev

  # Frontend App (Development mode with hot reload)
  frontend:
    image: node:18-alpine
    container_name: gamma-frontend-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend
    depends_on:
      - backend
    networks:
      - gamma-dev-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # MongoDB Express (Database UI)
  mongo-express:
    image: mongo-express:latest
    container_name: gamma-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - gamma-dev-network

networks:
  gamma-dev-network:
    driver: bridge

volumes:
  mongodb_dev_data:
    driver: local
