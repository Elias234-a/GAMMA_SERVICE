name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # Quick validation for PRs
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: 🧪 Quick backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret
        run: npm run test:models --if-present || npm test

      - name: 🔨 Test frontend build
        run: npm run build

      - name: 📊 PR Summary
        run: |
          echo "### ✅ PR Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "- All tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- Ready for review" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Automated checks passed! Ready for review.'
            })
